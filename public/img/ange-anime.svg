<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <style>
    .anim-part { transform-box: fill-box; }
    #poitrine-groupe { transform-origin: 290px 510px; animation: respirer 6s ease-in-out infinite; }
    @keyframes respirer { 0%, 100% { transform: scale(1, 1) translate(0, 0); } 45% { transform: scale(1.032, 1.015) translate(4px, -2px); } 75% { transform: scale(1.01, 1.005) translate(1px, 0); } }
    #queue-groupe { transform-origin: 215px 625px; animation: balancer-queue 6s ease-in-out infinite; }
    @keyframes balancer-queue { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(3.8deg); } }
    #oreille-arriere { transform-origin: 278px 342px; animation: fremir-oreille-arriere 6s ease-in-out infinite; }
    #oreille-avant { transform-origin: 256px 350px; animation: fremir-oreille-avant 6s ease-in-out infinite; }
    @keyframes fremir-oreille-arriere { 0%, 24%, 44%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-5deg); } 36% { transform: rotate(2deg); } }
    @keyframes fremir-oreille-avant { 0%, 26%, 46%, 100% { transform: rotate(0deg); } 32% { transform: rotate(-4deg); } 38% { transform: rotate(1.5deg); } }
    .ruban-vent { fill: none; stroke: #F4C430; stroke-linecap: round; stroke-dasharray: 290; stroke-dashoffset: 290; opacity: 0; }
    #ruban-1 { stroke-width: 7.5; animation: souffler-ruban-1 6s ease-in-out infinite; }
    #ruban-2 { stroke-width: 5.5; animation: souffler-ruban-2 6s ease-in-out infinite; }
    #ruban-3 { stroke-width: 4; animation: souffler-ruban-3 6s ease-in-out infinite; }
    @keyframes souffler-ruban-1 { 0%, 6% { stroke-dashoffset: 290; opacity: 0; transform: translate(0, 0); } 18% { opacity: 0.92; } 46% { stroke-dashoffset: 0; opacity: 0.85; } 62%, 100% { stroke-dashoffset: -140; opacity: 0; transform: translate(16px, -12px); } }
    @keyframes souffler-ruban-2 { 0%, 22% { stroke-dashoffset: 290; opacity: 0; transform: translate(0, 0); } 34% { opacity: 0.88; } 64% { stroke-dashoffset: 0; opacity: 0.8; } 80%, 100% { stroke-dashoffset: -140; opacity: 0; transform: translate(18px, -10px); } }
    @keyframes souffler-ruban-3 { 0%, 38% { stroke-dashoffset: 290; opacity: 0; transform: translate(0, 0); } 50% { opacity: 0.85; } 80% { stroke-dashoffset: 0; opacity: 0.75; } 96%, 100% { stroke-dashoffset: -140; opacity: 0; transform: translate(14px, -14px); } }
    .etincelle-vent { fill: #F4C430; opacity: 0; }
    #etincelle-1 { animation: flotter-etincelle-1 6s ease-in-out infinite; }
    #etincelle-2 { animation: flotter-etincelle-2 6s ease-in-out infinite; }
    #etincelle-3 { animation: flotter-etincelle-3 6s ease-in-out infinite; }
    @keyframes flotter-etincelle-1 { 0%, 15%, 60%, 100% { opacity: 0; transform: translate(0, 0) scale(0.7); } 35% { opacity: 0.9; transform: translate(8px, -6px) scale(1); } }
    @keyframes flotter-etincelle-2 { 0%, 32%, 78%, 100% { opacity: 0; transform: translate(0, 0) scale(0.7); } 52% { opacity: 0.85; transform: translate(10px, -8px) scale(1); } }
    @keyframes flotter-etincelle-3 { 0%, 48%, 92%, 100% { opacity: 0; transform: translate(0, 0) scale(0.7); } 68% { opacity: 0.8; transform: translate(8px, -10px) scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      #poitrine-groupe, #queue-groupe, #oreille-arriere, #oreille-avant, .ruban-vent, .etincelle-vent { animation: none !important; transform: none !important; }
      .ruban-vent { stroke-dasharray: none; stroke-dashoffset: 0; opacity: 0.85; }
      .etincelle-vent { opacity: 0.8; }
    }
  </style>
  <g id="sol-foret">
