# Netlify reconstruit le site à chaque modification du dépôt.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fonctions de l'espace abonné (connexion, bibliothèque, paiements Stripe).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
